<body>
<div class="app">
<header class="top">
  <div class="brand"><div class="logo">⌁</div><div><h1><span data-i18n="App.pantryPrice"></span></h1><p><span data-i18n="Statistics.yourGroceryPricesRemembered"></span></p></div></div>

</header>
<div class="layout">
  <aside class="sidebar" aria-label="Main navigation" data-i18n-aria-label="App.mainNavigation">
    <button class="nav" data-page="overview" title="Statistics" data-i18n-title="App.statistics"><span class="nav-icon">▥</span><span class="nav-label"><span data-i18n="App.statistics"></span></span></button>
    <button class="nav active" data-page="products" title="Products" data-i18n-title="Products.products"><span class="nav-icon">▦</span><span class="nav-label"><span data-i18n="Products.products"></span></span></button>
    <button class="nav" data-page="compare" title="Compare prices" data-i18n-title="PriceComparison.comparePrices"><span class="nav-icon">⇄</span><span class="nav-label"><span data-i18n="PriceComparison.comparePrices"></span></span></button>
    <button class="nav" data-page="quickbuy" title="Shopping list" data-i18n-title="ShoppingList.shoppingList"><span class="nav-icon">🛒</span><span class="nav-label"><span data-i18n="ShoppingList.shoppingList"></span></span></button>
    <button class="nav" data-page="history" title="Price history" data-i18n-title="PriceHistory.priceHistory"><span class="nav-icon">↗</span><span class="nav-label"><span data-i18n="PriceHistory.priceHistory"></span></span></button>
    <button class="nav" data-page="settings" title="Settings" data-i18n-title="Settings.settings"><span class="nav-icon">⚙</span><span class="nav-label"><span data-i18n="Settings.settings"></span></span></button>
    <button class="nav nav-record" data-action="add-price" title="Record price" data-i18n-title="App.recordPrice"><span class="nav-icon">＋</span><span class="nav-label"><span data-i18n="App.recordPrice"></span></span></button>
    <div class="side-note"><span data-i18n="Settings.storedLocallyInThisBrowserOnThisDeviceExportBackupsRegularly"></span></div>
  </aside>
  <main class="main">
    <section id="page-overview" class="page hidden">
      <div class="page-head"><div><h2><span data-i18n="Statistics.overview"></span></h2><p><span data-i18n="App.aClearViewOfWhatYourGroceriesCostOverTime"></span></p></div></div>
      <div class="stats">
        <div class="stat"><div class="label"><span data-i18n="Products.productsTracked"></span></div><div class="value" id="statProducts">0</div><div class="hint"><span data-i18n="Products.distinctProductEntries"></span></div></div>
        <div class="stat"><div class="label"><span data-i18n="App.priceRecords"></span></div><div class="value" id="statRecords">0</div><div class="hint"><span data-i18n="PriceHistory.everySavedObservationIsKept"></span></div></div>
        <div class="stat"><div class="label"><span data-i18n="Statistics.latestPriceChanges"></span></div><div class="value" id="statChanges">0</div><div class="hint"><span data-i18n="Products.productsWithMultiplePrices"></span></div></div>
      </div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="Statistics.recentPriceUpdates"></span></h3><button class="small" data-goto="history"><span data-i18n="PriceHistory.viewHistory"></span></button></div><div id="recentTable"></div></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="Products.productsToWatch"></span></h3><button class="small" data-goto="products"><span data-i18n="Products.allProducts"></span></button></div><div id="watchTable"></div></div>
    </section>
    <section id="page-products" class="page">
      <div class="page-head"><div><h2><span data-i18n="Products.products"></span></h2><p><span data-i18n="Products.manageYourCatalogueAndRecordNewPricesWheneverYouCheckAStore"></span></p></div><button class="primary" id="addProductBtn"><span data-i18n="Products.addProduct"></span></button></div>
      <div class="panel"><div class="tools"><input id="productSearch" placeholder="Search products, brands or tags…" data-i18n-placeholder="Products.searchProductsBrandsOrTags"><select id="productStoreFilter"><option value=""><span data-i18n="PriceComparison.allSupermarkets"></span></option></select><select id="productTagFilter"><option value=""><span data-i18n="Products.allTags"></span></option></select></div><div id="productsTable"></div></div>
    </section>
    <section id="page-compare" class="page hidden">
      <div class="page-head"><div><h2><span data-i18n="PriceComparison.compareSupermarkets"></span></h2><p><span data-i18n="Products.chooseAProductToSeeTheLatestRecordedPriceAtEachSupermarketRankedByComp"></span></p></div><button class="primary" id="addComparePriceBtn"><span data-i18n="App.recordPrice2"></span></button></div>
      <div class="panel">
        <div class="form-grid" style="margin-bottom:14px">
          <div class="field"><label for="compareProduct"><span data-i18n="Products.product"></span></label><select id="compareProduct"></select></div>
          <div class="field"><label for="compareSort"><span data-i18n="PriceComparison.rankSupermarketsBy"></span></label><select id="compareSort"><option value="unit"><span data-i18n="PriceComparison.lowestUnitPriceLKgUnit"></span></option><option value="total"><span data-i18n="PriceComparison.lowestTotalPackPrice"></span></option></select></div>
        </div>
        <div class="notice"><span data-i18n="PriceComparison.forAFairComparisonTheAppConvertsPackSizesToACommonBaseUnitExample150Fo"></span></div>
        <div id="compareSummary"></div>
      </div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="PriceComparison.latestPriceAtEachSupermarket"></span></h3><span class="help"><span data-i18n="PriceHistory.basedOnYourSavedObservations"></span></span></div><div id="compareTable"></div></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="PriceHistory.priceHistoryBySupermarket"></span></h3><span class="help"><span data-i18n="PriceComparison.oneLinePerSupermarket"></span></span></div><div id="compareChart"></div></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="PriceComparison.howTheCalculationWorks"></span></h3></div>
        <p style="margin:0 0 8px"><strong><span data-i18n="PriceComparison.pricePerStandardUnitTotalPackPriceTotalQuantityInStandardUnits"></span></strong></p>
        <p class="help" style="margin:0"><span data-i18n="PriceComparison.litresConvertMillilitresToLitresByDividingBy1000KilogramsConvertGramsT"></span></p>
      </div>
    </section>
    <section id="page-quickbuy" class="page hidden">
      <div class="page-head"><div><h2><span data-i18n="ShoppingList.shoppingList"></span></h2><p><span data-i18n="ShoppingList.What.description"></span></p></div><button class="small" id="clearShoppingList"><span data-i18n="ShoppingList.clearList"></span></button></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="ShoppingList.What.title"></span></h3><span class="help" id="shoppingSelectedCount"><span data-i18n="App.text0Selected"></span></span></div>
        <div class="tools"><input id="shoppingSearch" placeholder="Search products, brands or tags…" data-i18n-placeholder="Products.searchProductsBrandsOrTags"><button id="selectVisibleProducts"><span data-i18n="ShoppingList.selectVisible"></span></button><button id="deselectVisibleProducts"><span data-i18n="ShoppingList.deselectVisible"></span></button></div><div id="shoppingProducts"></div>
      </div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="ShoppingList.Where.title"></span></h3><span class="help"><span data-i18n="ShoppingList.rankedByTotalBasketPrice"></span></span></div>
        <div class="notice"><span data-i18n="ShoppingList.Where.description"></span></div><div id="shoppingRecommendations"></div>
      </div>
    </section>
    <section id="page-history" class="page hidden">
      <div class="page-head"><div><h2><span data-i18n="PriceHistory.priceHistory"></span></h2><p><span data-i18n="PriceHistory.eachEntryIsAnObservationSavingANewPriceNeverOverwritesAnOlderOne"></span></p></div><button class="primary" id="addPriceBtn"><span data-i18n="App.recordPrice2"></span></button></div>
      <div class="panel"><div class="tools"><input id="historySearch" placeholder="Search product…" data-i18n-placeholder="Products.searchProduct"><select id="historyStoreFilter"><option value=""><span data-i18n="PriceComparison.allSupermarkets"></span></option></select><select id="historySort"><option value="date-desc"><span data-i18n="App.newestFirst"></span></option><option value="date-asc"><span data-i18n="App.oldestFirst"></span></option><option value="price-asc"><span data-i18n="App.priceLowToHigh"></span></option><option value="price-desc"><span data-i18n="App.priceHighToLow"></span></option></select></div><div id="historyTable"></div></div>
    </section>
    <section id="page-settings" class="page hidden">
      <div class="page-head"><div><h2><span data-i18n="Settings.settings"></span></h2><p><span data-i18n="App.manageTheListsUsedThroughoutYourTracker"></span></p></div></div>
      <div class="panel"><div class="panel-title"><h3 data-i18n="Settings.language"><span data-i18n="Settings.language"></span></h3></div><div class="field" style="max-width:320px"><label for="languageSelect" data-i18n="Settings.appLanguage"><span data-i18n="Settings.appLanguage"></span></label><select id="languageSelect" aria-label="App language" data-i18n-aria-label="Settings.appLanguage"><option value="en"><span data-i18n="App.english"></span></option></select><p class="help" data-i18n="Settings.chooseTheLanguageUsedForTheAppInterface"><span data-i18n="Settings.chooseTheLanguageUsedForTheAppInterface"></span></p></div></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="PriceComparison.supermarkets"></span></h3></div><form id="storeForm" class="manage-form"><input id="storeName" placeholder="e.g. Lidl" data-i18n-placeholder="App.eGLidl" required maxlength="80"><button class="primary"><span data-i18n="PriceComparison.addSupermarket"></span></button></form><div id="storeList"></div></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="Products.tags"></span></h3></div><form id="tagForm" class="manage-form"><input id="tagName" placeholder="e.g. Fruit, Bottled, Organic" data-i18n-placeholder="App.eGFruitBottledOrganic" required maxlength="50"><button class="primary"><span data-i18n="Products.addTag"></span></button></form><div id="tagList"></div></div>
      <div class="panel"><div class="panel-title"><h3><span data-i18n="Settings.dataAndPrivacy"></span></h3></div><p class="help"><span data-i18n="Products.yourRecordsAreStoredInThisBrowserUsingIndexedDBTheyAreNotSentToAServer"></span></p><div class="actions" style="margin-top:14px"><button id="exportBtn2"><span data-i18n="Settings.exportJSONBackup"></span></button><label class="file-label"><span data-i18n="Settings.importJSONBackup"></span><input id="importFile2" type="file" accept=".json,application/json" hidden></label><button id="resetDemo" class="danger"><span data-i18n="Settings.clearAllData"></span></button></div></div>
    </section>
  </main>
</div>
<div class="footer"><span data-i18n="PriceHistory.pantryPriceLocalFirstPricesAreRecordedManuallyCurrencyEUR"></span></div>
</div>
<div id="modalRoot"></div><div id="toast" role="status"></div>

// Also localize generated interface content. It uses the same fixed English dictionary;
// unknown text is left unchanged and is never added to the dictionary at runtime.
const localizationTextKeys = new WeakMap();
const localizationAttrKeys = new WeakMap();
function localizeNode(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let node;

    const original = localizationTextKeys.get(node) ?? node.nodeValue;
    localizationTextKeys.set(node, original);
    const translated = translateEnglishText(original);
    if (node.nodeValue !== translated) node.nodeValue = translated;
  }
  const elements = root.nodeType === Node.ELEMENT_NODE ? [root, ...root.querySelectorAll("*")] : [...root.querySelectorAll("*")];
  for (const el of elements) {
    for (const [attr,dataAttr] of [["placeholder","data-i18n-placeholder"],["title","data-i18n-title"],["aria-label","data-i18n-aria-label"]]) {

async function importBackup(file){if(!file)return;try{const data=JSON.parse(await file.text());if(!data||!Array.isArray(data.products)||!Array.isArray(data.stores)||!Array.isArray(data.tags)||!Array.isArray(data.records))throw Error("Invalid backup");if(!confirm("Import this backup? Existing records with matching IDs will be replaced; other existing records will be kept."))return;for(const [key,store] of [["products","products"],["stores","stores"],["tags","tags"],["records","records"]])for(const obj of data[key]){if(!obj.id)throw Error("Missing record ID");await put(store,obj);}await load();render();toast("Backup imported");}catch(e){alert("Could not import this backup. Please choose a Pantry Price JSON backup.");}}
function addDefaults(){return Promise.all([["Lidl","Supermarket"],["Fruit","Bottled","Dairy","Organic","Household"]].map(async()=>{}));}
document.addEventListener("click",async e=>{const nav=e.target.closest("[data-page]");if(nav){go(nav.dataset.page);return;}const goto=e.target.closest("[data-goto]");if(goto){go(goto.dataset.goto);return;}const close=e.target.closest("[data-close-modal]");if(close){closeModal();return;}const b=e.target.closest("[data-action]");if(!b)return;const {action,id}=b.dataset;if(action==="compare-product"){go("compare");$("compareProduct").value=id;renderCompare();return;}if(action==="add-product")productForm();if(action==="edit-product")productForm(getProduct(id));if(action==="add-price")priceForm(id);if(action==="edit-record"){const r=state.records.find(x=>x.id===id);if(r)priceForm(r.productId,r);}if(action==="delete-record"){const r=state.records.find(x=>x.id===id);if(r&&confirm(`Delete the price record from ${dateFmt(r.date)}? This cannot be undone.`)){await del("records",id);await load();render();toast(t("UI.Messages.priceRecordDeleted"));}}if(action==="delete-product"){const p=getProduct(id),n=state.records.filter(r=>r.productId===id).length;if(p&&confirm(n?`"${p.name}" has ${n} price record(s). Archive the product so its history remains intact?`:`Delete "${p.name}"?`)){if(n){await put("products",{...p,archived:true,name:p.name+" (archived)"});}else await del("products",id);await load();render();toast(n?"Product archived":"Product deleted");}}if(action==="rename-store"||action==="rename-tag"){const type=action==="rename-store"?"store":"tag",obj=type==="store"?getStore(id):getTag(id),name=prompt("New name:",obj?.name||"");if(name&&name.trim()){obj.name=name.trim();obj.updatedAt=new Date().toISOString();await put(type==="store"?"stores":"tags",obj);await load();render();toast(t("UI.Settings.renamed"));}}if(action==="remove-store")await removeWithReference("store",getStore(id));if(action==="remove-tag")await removeWithReference("tag",getTag(id));});
$("addProductBtn").onclick=()=>productForm();$("addPriceBtn").onclick=()=>priceForm();$("productSearch").addEventListener("input",renderProducts);$("productStoreFilter").addEventListener("change",renderProducts);$("productTagFilter").addEventListener("change",renderProducts);$("historySearch").addEventListener("input",renderHistory);$("historyStoreFilter").addEventListener("change",renderHistory);$("historySort").addEventListener("change",renderHistory);$("compareProduct").addEventListener("change",renderCompare);$("compareSort").addEventListener("change",renderCompare);$("shoppingSearch").addEventListener("input",renderQuickBuy);
$("clearShoppingList").addEventListener("click",()=>{if(confirm("Clear all selected products from today's shopping list?")){shoppingSelection={};saveShoppingSelection();renderQuickBuy();}});
$("selectVisibleProducts").addEventListener("click",()=>{const q=$("shoppingSearch").value.trim().toLowerCase();state.products.filter(p=>!p.archived&&(!q||(p.name+" "+(p.brand||"")+" "+(p.tagIds||[]).map(id=>getTag(id)?.name||"").join(" ")).toLowerCase().includes(q))).forEach(p=>{shoppingSelection[p.id]={selected:true,qty:Math.max(1,Number(shoppingSelection[p.id]?.qty)||1)}});saveShoppingSelection();renderQuickBuy();});
$("deselectVisibleProducts").addEventListener("click",()=>{const q=$("shoppingSearch").value.trim().toLowerCase();state.products.filter(p=>!p.archived&&(!q||(p.name+" "+(p.brand||"")+" "+(p.tagIds||[]).map(id=>getTag(id)?.name||"").join(" ")).toLowerCase().includes(q))).forEach(p=>{if(shoppingSelection[p.id])shoppingSelection[p.id].selected=false});saveShoppingSelection();renderQuickBuy();});
$("shoppingProducts").addEventListener("change",e=>{const check=e.target.closest("[data-shopping-check]"),qty=e.target.closest("[data-shopping-qty]");if(check){const id=check.dataset.shoppingCheck;shoppingSelection[id]={...(shoppingSelection[id]||{}),selected:check.checked,qty:Math.max(1,Number(shoppingSelection[id]?.qty)||1)};saveShoppingSelection();renderQuickBuy();}else if(qty){const id=qty.dataset.shoppingQty;shoppingSelection[id]={...(shoppingSelection[id]||{}),selected:!!shoppingSelection[id]?.selected,qty:Math.max(1,Math.floor(Number(qty.value)||1))};saveShoppingSelection();renderShoppingRecommendations();}});
$("addComparePriceBtn").onclick=()=>priceForm($("compareProduct").value||undefined);$("exportBtn2").onclick=exportBackup;
$("importFile2").onchange=e=>{importBackup(e.target.files[0]);e.target.value="";};
$("storeForm").onsubmit=async e=>{e.preventDefault();const name=$("storeName").value.trim();if(!name)return;if(state.stores.some(s=>s.name.toLowerCase()===name.toLowerCase()))return toast("That supermarket already exists");await put("stores",{id:uid(),name,createdAt:new Date().toISOString()});$("storeName").value="";await load();render();toast(t("UI.Messages.supermarketAdded"));};
$("tagForm").onsubmit=async e=>{e.preventDefault();const name=$("tagName").value.trim();if(!name)return;if(state.tags.some(t=>t.name.toLowerCase()===name.toLowerCase()))return toast("That tag already exists");await put("tags",{id:uid(),name,createdAt:new Date().toISOString()});$("tagName").value="";await load();render();toast(t("UI.Messages.tagAdded"));};
$("resetDemo").onclick=async()=>{if(!confirm("Permanently delete ALL products, price records, supermarkets and tags from this browser? Export a backup first if you may need this data."))return;for(const s of ["products","records","stores","tags"])for(const x of await all(s))await del(s,x.id);await load();render();toast(t("UI.Messages.allLocalDataCleared"));};
// The language is controlled by Settings, never inferred from the browser locale.
document.addEventListener("change", event => {
  if (event.target?.id === "languageSelect") {
    language = event.target.value || "en";
    try { localStorage.setItem("pantry-price-language", language); } catch {}
    applyLanguage();
  }
});
const localizationObserver = new MutationObserver(records => {
  for (const record of records) {
    if (record.type === "childList") record.addedNodes.forEach(node => { if (node.nodeType === Node.ELEMENT_NODE || node.nodeType === Node.TEXT_NODE) { const root = node.nodeType === Node.TEXT_NODE ? node.parentElement : node; if(root) { applyGeneratedTranslations(root); } } });
    else if (record.type === "characterData") applyGeneratedTranslations(record.target.parentElement);
  }
});
function applyGeneratedTranslations(root) { localizeNode(root); }
localizationObserver.observe(document.body, {subtree:true, childList:true, characterData:true});
applyLanguage();

(async()=>{try{db=await openDB();await load();if(!state.stores.length&&!state.products.length&&!state.tags.length){for(const name of ["Lidl","Greens","PAVI","Welbee's"])await put("stores",{id:uid(),name,createdAt:new Date().toISOString()});for(const name of ["Fruit","Bottled","Dairy","Organic","Household"])await put("tags",{id:uid(),name,createdAt:new Date().toISOString()});await load();}render();go("products");}catch(err){console.error(err);document.querySelector(".main").innerHTML='<div class="panel"><h2>Local storage unavailable</h2><p>This tracker needs a browser with IndexedDB enabled. Try opening it in a modern browser and avoid private browsing modes that clear local data.</p></div>';}})();
})();
</script>
